name: pages

# Validates both landing lanes on every PR. The enhanced homepage and /plain/
# publish only after both lanes pass, from master with PAGES_ENABLED="true".
on:
  pull_request:
    paths: ["site/**", "site-3d/**", "scripts/site/**", "scripts/bootstrap/**", "tests/browser/**", "tests/test_site*.py", "assets/readme/**", "README.md", ".github/workflows/pages.yml"]
  push:
    branches: [master]
    paths: ["site/**", "site-3d/**", "scripts/site/**", "scripts/bootstrap/**", "tests/browser/**", "tests/test_site*.py", "assets/readme/**", "README.md", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test the page rules
        run: python3 -m unittest tests.test_site -v
      - name: Build
        run: python3 scripts/site/build.py --out build/site

  enhanced:
    # Playwright 1.59 supports this image; avoid an OS rollout breaking WebKit.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test and build the optional visual landing
        run: |
          python3 -m unittest tests.test_site_3d -v
          python3 scripts/site/build_3d.py
      - name: Install pinned browser tests
        working-directory: tests/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit
      - name: Browser checks
        working-directory: tests/browser
        env:
          WISP_BROWSERS: chromium,webkit
        run: |
          python3 -c 'from functools import partial; from http.server import ThreadingHTTPServer, SimpleHTTPRequestHandler; ThreadingHTTPServer(("127.0.0.1", 3000), partial(SimpleHTTPRequestHandler, directory="../../build")).serve_forever()' &
          server=$!
          trap 'kill "$server"' EXIT
          curl --fail --silent --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:3000/site-3d/ > /dev/null
          npm test
      - name: Assemble public homepage and independent no-script version
        run: |
          python3 scripts/site/build_3d.py --out build/published
          python3 scripts/site/build.py --out build/published/plain
          install -m 644 scripts/bootstrap/install.py build/published/install.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/published
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enhanced-landing-qa
          path: build/browser-qa

  deploy:
    needs: [build, enhanced]
    if: github.ref == 'refs/heads/master' && vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
