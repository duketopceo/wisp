name: pages

# Builds the landing page (site/) on every PR so a broken page is caught,
# and deploys it from master only when the repo variable PAGES_ENABLED is
# "true" and Pages is set to "GitHub Actions" in the repo settings.
on:
  pull_request:
    paths: ["site/**", "scripts/site/**", "assets/readme/**", "README.md", ".github/workflows/pages.yml"]
  push:
    branches: [master]
    paths: ["site/**", "scripts/site/**", "assets/readme/**", "README.md", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test the page rules
        run: python3 -m unittest tests.test_site -v
      - name: Build
        run: python3 scripts/site/build.py --out build/site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master' && vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
