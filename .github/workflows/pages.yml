name: website

# Validates both landing lanes on every PR. The enhanced homepage and /plain/
# become a Cloudflare Workers artifact only after both lanes pass.
# Publication and custom-domain changes remain separately authorized actions.
on:
  pull_request:
    paths: ["site/**", "site-3d/**", "scripts/site/**", "scripts/bootstrap/**", "tests/browser/**", "tests/test_site*.py", "tests/test_shipping_claims.py", "assets/readme/**", "README.md", "wrangler.json", "package.json", "package-lock.json", ".github/workflows/pages.yml"]
  push:
    branches: [master]
    paths: ["site/**", "site-3d/**", "scripts/site/**", "scripts/bootstrap/**", "tests/browser/**", "tests/test_site*.py", "tests/test_shipping_claims.py", "assets/readme/**", "README.md", "wrangler.json", "package.json", "package-lock.json", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test the page rules
        run: python3 -m unittest tests.test_site -v
      - name: Build
        run: python3 scripts/site/build.py --out build/site

  enhanced:
    # Playwright 1.59 supports this image; avoid an OS rollout breaking WebKit.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test and build the optional visual landing
        run: |
          python3 -m unittest tests.test_site_3d tests.test_site_workers -v
          python3 scripts/site/build_3d.py
          python3 scripts/site/build_workers.py
      - name: Install pinned Worker development server
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned browser tests
        working-directory: tests/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit
      - name: Browser checks
        working-directory: tests/browser
        env:
          WISP_BROWSERS: chromium,webkit
          WISP_SITE_URL: http://127.0.0.1:3000/
          WRANGLER_SEND_METRICS: "false"
        run: |
          ../../node_modules/.bin/wrangler dev --config ../../wrangler.json --local --ip 127.0.0.1 --port 3000 --log-level warn &
          server=$!
          trap 'kill "$server"' EXIT
          curl --fail --silent --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:3000/ > /dev/null
          npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enhanced-landing-qa
          path: build/browser-qa

  assets:
    needs: [build, enhanced]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test complete Worker bundle
        run: python3 -m unittest tests.test_site_workers -v
      - name: Assemble reviewed assets
        run: python3 scripts/site/build_workers.py
      - uses: actions/upload-artifact@v4
        with:
          name: wisp-workers-assets
          path: build/published
          include-hidden-files: true
          if-no-files-found: error
