name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  unit:
    # Linux is the primary platform and the v1.0 soak target; macOS is a
    # supported host (ROADMAP v2.0). CI runs both, because four
    # Linux-assuming tests rotted in unnoticed while this was ubuntu-only.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile-check scripts
        run: python -m py_compile wispd wisp/*.py wisp/tools/*.py scripts/propose_criteria.py tests/*.py
      - name: Test deps
        run: pip install sqlite-vec pillow
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rs/wispd
      - name: Rust build + tests
        working-directory: rs/wispd
        run: |
          cargo build --locked
          cargo test