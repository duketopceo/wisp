name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  unit:
    # Wisp is Linux-only; CI runs on ubuntu.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile-check scripts
        run: python -m py_compile wispd wisp/*.py wisp/tools/*.py tests/*.py
      - name: Test deps
        run: pip install sqlite-vec pillow
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Personal-config leak guard
        # Shipped surfaces must be open-source ready: no owner usernames,
        # private repo names, or personal checkout paths in code, seeds,
        # or the plugin mirror source. Repo identity URLs
        # (github.com/duketopceo/wisp) are allowlisted by not matching.
        run: |
          ! grep -rniE 'lukekimball|luke-agents|Documents/github/personal|omarchy-max' \
            wisp/ wispd shell-plugin/ scripts/ docs/CONFIG.md docs/INSTALL.md 2>/dev/null \
            | grep -v 'AGENTS.md\|docs/plans/\|docs/research/\|\.md:.*//'

  plugin:
    # the Omarchy marketplace mirror: build it and validate it (B15)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: qmllint
        run: |
          sudo apt-get update -y
          sudo apt-get install -y qt6-declarative-dev-tools || true
          echo "/usr/lib/qt6/bin" >> "$GITHUB_PATH"
      - name: Build and validate the plugin mirror
        run: python3 scripts/plugin_mirror.py --out build/mirror --version v0.0.0 --lint

  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rs/wispd
      - name: Rust build + tests
        working-directory: rs/wispd
        run: |
          cargo build --locked
          cargo test