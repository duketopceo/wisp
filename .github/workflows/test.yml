name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  unit:
    # Linux is the full-app target; macOS/Windows probe seams are experimental.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile-check scripts
        run: python -m py_compile wispd wisp/*.py wisp/tools/*.py tests/*.py
      - name: Test deps
        run: pip install sqlite-vec pillow
      - name: Qt tools for the QML suites
        # without these the QML lib, lint and shader tests skip green;
        # WISP_CI_REQUIRE_TOOLS turns a missing tool into a failure
        run: |
          sudo apt-get update -y
          sudo apt-get install -y qt6-declarative-dev-tools \
            qml6-module-qttest qml6-module-qtquick qt6-shader-baker
          echo "/usr/lib/qt6/bin" >> "$GITHUB_PATH"
      - name: Unit tests
        env:
          WISP_CI_REQUIRE_TOOLS: "1"
        run: python -m unittest discover -s tests -v

  plugin:
    # the Omarchy marketplace mirror: build it and validate it (B15)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: qmllint
        run: |
          sudo apt-get update -y
          sudo apt-get install -y qt6-declarative-dev-tools
          echo "/usr/lib/qt6/bin" >> "$GITHUB_PATH"
          # plugin_mirror --lint passes when qmllint is missing; CI must lint
          test -x /usr/lib/qt6/bin/qmllint
      - name: Build and validate the plugin mirror
        run: python3 scripts/plugin_mirror.py --out build/mirror --version v0.0.0 --lint

  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rs/wispd
      - name: Rust build + tests
        working-directory: rs/wispd
        run: |
          cargo build --locked
          cargo test
