name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu,    name: linux-x86_64,  ext: tar.gz }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, name: linux-aarch64, ext: tar.gz }
          - { os: macos-latest,  target: x86_64-apple-darwin,       name: macos-x86_64,  ext: tar.gz }
          - { os: macos-latest,  target: aarch64-apple-darwin,      name: macos-aarch64, ext: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,   name: windows-x86_64, ext: zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (linux aarch64 only)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build wispd-rs
        working-directory: rs/wispd
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage bundle (unix)
        if: matrix.ext == 'tar.gz'
        run: |
          stage="wisp-${{ matrix.name }}"
          mkdir -p "$stage/bin" "$stage/wisp" "$stage/shells" "$stage/shell-plugin"
          cp "rs/wispd/target/${{ matrix.target }}/release/wispd" "$stage/bin/wispd-rs"
          cp wispd "$stage/bin/wispd"
          cp -r wisp "$stage/"
          cp -r shells "$stage/"
          cp -r shell-plugin "$stage/"
          cp LICENSE README.md docs/INSTALL.md docs/CONFIG.md "$stage/" 2>/dev/null || true
          tar czf "wisp-${{ matrix.name }}.tar.gz" "$stage"

      - name: Stage bundle (windows)
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          $stage = "wisp-${{ matrix.name }}"
          New-Item -ItemType Directory -Force "$stage/bin", "$stage/wisp", "$stage/shells", "$stage/shell-plugin" | Out-Null
          Copy-Item "rs/wispd/target/${{ matrix.target }}/release/wispd.exe" "$stage/bin/wispd-rs.exe"
          Copy-Item wispd "$stage/bin/wispd"
          Copy-Item -Recurse wisp, shells, shell-plugin "$stage/"
          Copy-Item LICENSE, README.md "$stage/"
          Compress-Archive "$stage" "wisp-${{ matrix.name }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: wisp-${{ matrix.name }}
          path: wisp-${{ matrix.name }}.${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create GitHub release
        run: |
          gh release create "${{ github.ref_name }}" dist/*/*.tar.gz dist/*/*.zip \
            --title "Wisp ${{ github.ref_name }}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
