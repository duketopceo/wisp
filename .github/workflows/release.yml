name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu,    name: linux-x86_64,  ext: tar.gz }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, name: linux-aarch64, ext: tar.gz }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (linux aarch64 only)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build wispd-rs
        working-directory: rs/wispd
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage bundle (unix)
        if: matrix.ext == 'tar.gz'
        run: |
          stage="wisp-${{ matrix.name }}"
          mkdir -p "$stage/bin" "$stage/wisp" "$stage/shells" "$stage/shell-plugin" "$stage/scripts" "$stage/docs"
          cp "rs/wispd/target/${{ matrix.target }}/release/wispd" "$stage/bin/wispd-rs"
          cp wispd "$stage/wispd"
          cp -r wisp "$stage/"
          cp -r shells "$stage/"
          cp -r shell-plugin "$stage/"
          cp -r docs/. "$stage/docs/"
          cp scripts/fetch_whisper.sh "$stage/scripts/"
          cp LICENSE README.md "$stage/"
          tar czf "wisp-${{ matrix.name }}.tar.gz" "$stage"

      - uses: actions/upload-artifact@v4
        with:
          name: wisp-${{ matrix.name }}
          path: wisp-${{ matrix.name }}.${{ matrix.ext }}

  plugin:
    # the Omarchy marketplace mirror: the plugin alone, version = the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: qmllint
        run: |
          sudo apt-get update -y
          sudo apt-get install -y qt6-declarative-dev-tools || true
          echo "/usr/lib/qt6/bin" >> "$GITHUB_PATH"
      - name: Build and validate the mirror
        run: |
          python3 scripts/plugin_mirror.py --out build/mirror \
            --version "${{ github.ref_name }}" --lint
          tar czf "wisp-plugin-${{ github.ref_name }}.tar.gz" -C build mirror
      - uses: actions/upload-artifact@v4
        with:
          name: wisp-plugin
          path: wisp-plugin-${{ github.ref_name }}.tar.gz

  release:
    needs: [build, plugin]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create GitHub release
        run: |
          gh release create "${{ github.ref_name }}" dist/*/*.tar.gz \
            --title "Wisp ${{ github.ref_name }}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
