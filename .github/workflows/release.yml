name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag to build and release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  PYTHONDONTWRITEBYTECODE: "1"
  CARGO_INCREMENTAL: "0"
  TZ: UTC
  LC_ALL: C.UTF-8

jobs:
  build:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native Linux runners: no cross-compiled binary passed off as tested.
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, name: linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, name: linux-aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.17"

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, pinned
        with:
          # Same compiler as the last successful CI run, not a toolchain upgrade.
          toolchain: "1.99.1"
          targets: ${{ matrix.target }}

      - name: Validate release tag and derive reproducible metadata
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          test "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "$(git rev-parse HEAD)"
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=--remap-path-prefix=$GITHUB_WORKSPACE=/wisp" >> "$GITHUB_ENV"

      - name: Release packaging regression tests
        run: python -m unittest discover -s tests -p test_release_packaging.py -v

      - name: Build and test wispd-rs with the checked-in lockfile
        working-directory: rs/wispd
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: |
          cargo build --locked --release --target "$RUST_TARGET"
          cargo test --locked --target "$RUST_TARGET"

      - name: Build complete deterministic runtime payload
        env:
          RUST_TARGET: ${{ matrix.target }}
          BUNDLE_TARGET: ${{ matrix.name }}
        run: |
          python scripts/release/build.py bundle --source . \
            --binary "rs/wispd/target/$RUST_TARGET/release/wispd" \
            --target "$BUNDLE_TARGET" --version "$RELEASE_TAG" \
            --commit "$SOURCE_COMMIT" --epoch "$SOURCE_DATE_EPOCH" --out dist

      - name: Verify archive inventory, preview and isolated installation
        shell: bash
        env:
          BUNDLE_TARGET: ${{ matrix.name }}
        run: |
          archive="dist/wisp-$BUNDLE_TARGET.tar.gz"
          python scripts/release/verify.py --archive "$archive" \
            --sha256 "$(sha256sum "$archive" | cut -d' ' -f1)" \
            --version "$RELEASE_TAG" --commit "$SOURCE_COMMIT" \
            --target "$BUNDLE_TARGET" | tee "dist/verification-$BUNDLE_TARGET.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wisp-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  plugin:
    # the Omarchy marketplace mirror: the plugin alone, version = the tag
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.17"
      - name: qmllint
        run: |
          sudo apt-get update -y
          sudo apt-get install -y qt6-declarative-dev-tools
          echo "/usr/lib/qt6/bin" >> "$GITHUB_PATH"
      - name: Build and validate the mirror
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          command -v qmllint
          python3 scripts/plugin_mirror.py --out build/mirror \
            --version "$RELEASE_TAG" --commit "$(git rev-parse HEAD)" --lint
          python3 scripts/release/build.py plugin --source build/mirror \
            --version "$RELEASE_TAG" --epoch "$(git show -s --format=%ct HEAD)" \
            --out dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wisp-plugin
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: [build, plugin]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.17"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          pattern: wisp-*
          merge-multiple: true
      - name: Require all three assets and publish their SHA-256 checksums
        run: |
          set -euo pipefail
          test -f dist/wisp-linux-x86_64.tar.gz
          test -f dist/wisp-linux-aarch64.tar.gz
          test -f "dist/wisp-plugin-$RELEASE_TAG.tar.gz"
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 3
          python scripts/release/build.py checksums --out dist/SHA256SUMS \
            dist/wisp-linux-x86_64.tar.gz dist/wisp-linux-aarch64.tar.gz \
            "dist/wisp-plugin-$RELEASE_TAG.tar.gz"
          (cd dist && sha256sum --check SHA256SUMS)
      - name: Create verified draft release, upload everything, then publish
        shell: bash
        run: |
          set -euo pipefail
          # Do not overwrite an existing release or mix new and old assets.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; inspect it instead of overwriting." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" --verify-tag --draft \
            --title "Wisp $RELEASE_TAG" --generate-notes \
            dist/*.tar.gz dist/SHA256SUMS
          # Confirm the uploaded bytes, not just the local staging directory.
          mkdir downloaded
          gh release download "$RELEASE_TAG" --dir downloaded
          (cd downloaded && sha256sum --check SHA256SUMS)
          prerelease=()
          [[ "$RELEASE_TAG" != *-* ]] || prerelease+=(--prerelease)
          gh release edit "$RELEASE_TAG" --draft=false "${prerelease[@]}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
