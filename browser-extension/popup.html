<!doctype html>
<meta charset="utf-8">
<title>Wisp browser lane</title>
<style>
  body { width: 280px; margin: 12px; font: 13px system-ui, sans-serif; }
  button { font: inherit; padding: 6px 10px; }
  #stop { width: 100%; padding: 12px; font-weight: 600; background: #b3261e; color: #fff; border: 0; border-radius: 6px; }
  label { display: block; margin: 8px 0 2px; }
  input { width: 100%; box-sizing: border-box; font: inherit; padding: 4px; }
  #status { margin: 8px 0; min-height: 1.4em; }
</style>
<div id="status">Not paired.</div>
<button id="stop">Stop Wisp</button>
<label for="code">Pairing code from Wisp</label>
<input id="code" inputmode="numeric" autocomplete="off" maxlength="12">
<label for="port">Port</label>
<input id="port" inputmode="numeric" value="47315">
<p><button id="pair">Pair</button></p>
<script src="popup.js"></script>
