<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Sign in</title></head>
<body>
  <h1>Sign in</h1>
  <form id="f" onsubmit="event.preventDefault(); document.getElementById('status').textContent = 'Submitted for ' + document.getElementById('user').value;">
    <p><label for="user">Username</label> <input id="user" name="user" type="text"></p>
    <p><label for="pw">Password</label> <input id="pw" name="pw" type="password"></p>
    <p><label for="code">Verification code</label> <input id="code" name="code" type="text" autocomplete="one-time-code"></p>
    <p><button id="go" type="submit">Continue</button></p>
  </form>
  <p id="status" role="status"></p>
  <p><a id="next" href="/done.html">Skip</a></p>
</body>
</html>
