[package]
name = "dimd"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
description = "Dim — cross-platform AI companion core daemon (Hey Clicky clone, BYO brain)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "2", features = ["json"] }
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
sqlite-vec = "0.1.9"
